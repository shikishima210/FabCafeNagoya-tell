name: 記録を更新

on:
  schedule:
    - cron: "17 * * * *"   # 1時間ごと（UTC基準・毎時17分）
  workflow_dispatch:        # Actions タブから手動でも実行できる

permissions:
  contents: write

concurrency:
  group: update-records
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Notion から記録を書き出す
        run: node scripts/fetch-notion.mjs

      - name: 変更があればコミット
        run: |
          # 記録が変わった時はコミットする。変わっていなくても、前回のコミットから7日たったら
          # 動作確認用の data/status.json だけコミットする（60日間コミットがないと GitHub が定期実行を止めるため）
          last=$(git log -1 --format=%ct -- data/ 2>/dev/null || echo 0)
          now=$(date +%s)
          if git diff --quiet -- data/records.json && git ls-files --error-unmatch data/records.json >/dev/null 2>&1; then
            if [ $((now - ${last:-0})) -lt 604800 ] && git ls-files --error-unmatch data/status.json >/dev/null 2>&1; then
              echo "変更なし"
              exit 0
            fi
            msg="動作確認 ($(date -u +%Y-%m-%dT%H:%MZ))"
          else
            msg="記録を更新 ($(date -u +%Y-%m-%dT%H:%MZ))"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records.json data/status.json
          git commit -m "$msg"
          # 手動の push と重なった時のために、取り込み直してから最大3回 push を試す
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "push に失敗しました"
          exit 1
